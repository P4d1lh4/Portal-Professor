# Blueprint do Render — backend FastAPI da Aplicação Professor.
# Importe via Render Dashboard → New → Blueprint, apontando para este repositório.
# As chaves marcadas com `sync: false` devem ser preenchidas manualmente no
# painel (são segredos e não ficam versionados).
services:
  - type: web
    name: portal-backend
    runtime: docker
    repo: https://github.com/P4d1lh4/Portal-Professor
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/healthz
    # O serviço de produção foi criado à mão, não por este Blueprint: quem manda
    # é o painel do Render. Estes valores repetem o painel (alteração 70): deploy
    # só depois dos checks do CI verdes, e só quando o commit mexe em backend/.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Definir com a URL da Vercel após o deploy do frontend.
      # Aceita múltiplas origens separadas por vírgula.
      - key: CORS_ORIGINS
        sync: false
      # Número de workers uvicorn. No plano free (512MB), mantenha 1.
      - key: WEB_CONCURRENCY
        value: "1"
