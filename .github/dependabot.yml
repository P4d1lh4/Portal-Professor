version: 2
updates:
  # Backend Python (requirements.txt)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    # minor/patch agrupados num PR; majors seguem um por PR.
    groups:
      minor-patch:
        update-types: [minor, patch]
    ignore:
      # supabase-py 2.31 (e postgrest, auth, storage, functions) exige httpx<0.29.
      - dependency-name: httpx
        versions: [">=0.29"]

  # Frontend npm (package.json / package-lock.json)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      minor-patch:
        update-types: [minor, patch]
      # react/react-dom (e @types) têm peer exato entre si: em PRs separados o
      # npm ci quebra com ERESOLVE (#101/#103).
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
    ignore:
      # TS 7 (nativo) sem suporte no typescript-eslint 8 (peer <6.1) (PR #58).
      - dependency-name: typescript
        versions: [">=7"]

  # GitHub Actions usadas no CI
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci

  # Imagens base dos Dockerfiles, pinadas por tag + digest: sem isto o digest
  # envelheceria sem ninguém ver (I-22).
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - backend

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - frontend
