name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar pytest + cobertura
        env:
          # Stubs: os testes mockam o Supabase (get_admin_db), mas o
          # Settings() do pydantic exige estas variáveis na importação.
          SUPABASE_URL: https://stub.supabase.co
          SUPABASE_ANON_KEY: stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key
          SUPABASE_JWT_SECRET: stub-jwt-secret
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=50

      - name: Auditoria de dependências (pip-audit)
        # Reporta CVEs conhecidos. Ainda não bloqueia o build (continue-on-error)
        # para não travar o CI em advisories sem correção disponível; remova o
        # continue-on-error para transformá-lo em gate quando a árvore estiver limpa.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de dependências (npm audit)
        # Não bloqueia o build ainda (ver nota no job backend).
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Testes (vitest)
        run: npm run test

      - name: Build (vite)
        env:
          # Stubs para o build passar mesmo sem secrets reais.
          # Em produção, defina como repository secrets.
          VITE_SUPABASE_URL: https://stub.supabase.co
          VITE_SUPABASE_ANON_KEY: stub-anon-key
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
