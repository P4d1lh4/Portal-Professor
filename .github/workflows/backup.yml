name: Backup

# Backup semanal do Supabase: o plano free não tem backup nem PITR (I-24/I-25).
# Leva o banco (roles, schema e dados via `supabase db dump`) e os anexos do
# bucket medical-certificates. O repositório é PÚBLICO, e artifact de repo
# público pode ser baixado por qualquer conta do GitHub. Por isso o pacote sai
# criptografado (gpg AES256) antes do upload. Secrets e restore: DEPLOY.md.
# ponytail: guarda só no GitHub (90 dias). Cópia fora do GitHub (Drive/S3) se
# o risco de perder a conta ou o repositório pesar.
on:
  schedule:
    - cron: "0 6 * * 1" # segunda, 03:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Conferir secrets
        run: |
          for v in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_PASSPHRASE; do
            [ -n "${!v}" ] || { echo "::error::secret $v não configurado (DEPLOY.md, seção Backup)"; exit 1; }
          done

      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Dump do banco (roles, schema, dados)
        run: |
          mkdir -p backup/db
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/db/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/db/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/db/data.sql --data-only --use-copy

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Anexos do bucket
        run: |
          pip install -r backend/requirements.txt
          python backend/scripts/backup_storage.py baixar backup/storage

      - name: Empacotar e criptografar
        run: |
          name="portal-backup-$(date -u +%F)"
          # A senha entra por arquivo (process substitution), não pela linha de comando.
          tar -czf - -C backup . | gpg --batch --yes --pinentry-mode loopback \
            --symmetric --cipher-algo AES256 \
            --passphrase-file <(printf '%s' "$BACKUP_PASSPHRASE") \
            -o "$name.tar.gz.gpg"
          ls -lh "$name.tar.gz.gpg"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.gpg
          retention-days: 90
          compression-level: 0 # já vem comprimido e criptografado
          if-no-files-found: error
