name: Keep-alive

# Bate no readyz: mantém o Supabase free ativo (pausa após 7 dias sem tráfego).
# Falha = e-mail do GitHub avisando que a produção está fora do ar.
# O cron pede 10 min, mas o GitHub atrasa e descarta execuções: em 2026-09-14/15
# o intervalo real foi de 1 a 5 h. Basta para o Supabase; o Render free (dorme
# após 15 min) não fica acordado, e o primeiro acesso leva até ~50 s.
# ponytail: o GitHub desativa cron em repo público após 60 dias sem commits;
# se acontecer, reative em Actions. Saída definitiva: Supabase Pro / Render Starter (O-02).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/readyz
        # Cold start do Render free leva ~25-50 s; o retry cobre o 502/503 enquanto acorda.
        run: curl -fsS --max-time 60 --retry 4 --retry-delay 15 --retry-all-errors https://portal-professor.onrender.com/api/readyz
